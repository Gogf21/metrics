nodeSelector:
  grafana-node: "true"

persistence:
  enabled: true
  existingClaim: "grafana-pvc"

service:
  type: NodePort
  port: 80
  nodePort: 30080

ingress:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

adminPassword: "admin"

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        url: http://victoriametrics-victoria-metrics-single-server.monitoring.svc.cluster.local:8428
        isDefault: true
        access: proxy
