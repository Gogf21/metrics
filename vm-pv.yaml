apiVersion: v1
kind: PersistentVolume
metadata:
  name: victoria-metrics-pv
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/mnt/data/victoria-metrics"
    type: DirectoryOrCreate # Если папки нет, Kubernetes сам её создаст
